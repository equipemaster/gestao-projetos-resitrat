<!DOCTYPE html>
<html class="light" lang="pt-BR">

<head>
    <meta charset="utf-8" />
    <link href="./favicon.svg" rel="icon" type="image/svg+xml" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Configurações - ProjectFlow</title>
    <meta content="light" name="color-scheme" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
        rel="stylesheet" />
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#135bec",
                        text: {
                            light: { primary: "#0d121b", secondary: "#526071", tertiary: "#8292a2" },
                            dark: { primary: "#ffffff", secondary: "#9ca3af", tertiary: "#6b7280" }
                        },
                        background: {
                            light: "#f6f6f8", dark: "#101622"
                        }
                    },
                    fontFamily: {
                        sans: ["Inter", "sans-serif"]
                    }
                }
            }
        };
    </script>
</head>

<body
    class="bg-background-light dark:bg-background-dark text-text-light-primary dark:text-text-dark-primary font-sans antialiased">
    <div class="flex h-screen w-full">
        <!-- Sidebar placeholder -->
        <aside
            class="w-64 border-r border-gray-200 dark:border-gray-800 bg-white dark:bg-background-dark flex-shrink-0 flex flex-col h-full">
      <div class="p-6 pb-0">
        <div class="flex items-center gap-3">
          <img src="logoresitrat.png" alt="Logo" class="h-12 w-auto object-contain">
        </div>
      </div>
      <div class="flex-1 overflow-y-auto px-6 py-4">
        <nav class="space-y-1">
                    <a class="flex items-center gap-3 rounded-lg px-3 py-2 text-text-light-secondary dark:text-text-dark-secondary hover:bg-primary/10 dark:hover:bg-primary/20 hover:text-primary dark:hover:text-primary transition-colors"
                        href="gerenciamentodeprojetos.html">
                        <span class="material-symbols-outlined">dashboard</span>
                        <p class="text-sm font-medium leading-normal">Dashboard</p>
                    </a>
                </nav>
            </div>
            <div class="p-6 border-t border-gray-200 dark:border-gray-800">
                <div class="space-y-1">
                    <a class="flex items-center gap-3 rounded-lg px-3 py-2 text-text-light-secondary dark:text-text-dark-secondary hover:bg-primary/10 dark:hover:bg-primary/20 hover:text-primary dark:hover:text-primary transition-colors"
                        href="ajuda.html">
                        <span class="material-symbols-outlined">help</span>
                        <p class="text-sm font-medium leading-normal">Ajuda e Suporte</p>
                    </a>
                    <a class="flex items-center gap-3 rounded-lg bg-primary/10 px-3 py-2 text-text-primary dark:text-text-dark-primary"
                        href="configuracoes.html">
                        <span class="material-symbols-outlined fill-1">settings</span>
                        <p class="text-sm font-medium leading-normal">Configurações</p>
                    </a>
                    <a class="flex items-center gap-3 rounded-lg px-3 py-2 text-text-light-secondary dark:text-text-dark-secondary hover:bg-primary/10 dark:hover:bg-primary/20 hover:text-primary dark:hover:text-primary transition-colors"
                        href="logout">
                        <span class="material-symbols-outlined">logout</span>
                        <p class="text-sm font-medium leading-normal">Sair</p>
                    </a>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 min-w-0 overflow-auto p-8">
            <h1 class="text-2xl font-bold mb-6">Configurações</h1>

            <div class="space-y-6 max-w-2xl">
                <!-- Profile Section -->
                <div
                    class="bg-white dark:bg-background-dark p-6 rounded-xl shadow-sm border border-gray-200 dark:border-gray-800">
                    <h2 class="text-lg font-semibold mb-4">Perfil</h2>
                    <div class="flex items-center gap-4 mb-6">
                        <div
                            class="h-16 w-16 rounded-full bg-gray-200 flex items-center justify-center text-2xl font-bold text-gray-500">
                            U
                        </div>
                        <div>
                            <button class="text-sm font-medium text-primary hover:underline">Alterar foto</button>
                        </div>
                    </div>
                    <div class="grid gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Nome
                                Completo</label>
                            <input type="text"
                                class="w-full rounded-lg border border-gray-300 dark:border-gray-700 p-2.5 text-sm dark:bg-gray-800 dark:text-white"
                                value="Usuário Demo">
                        </div>
                        <div>
                            <label
                                class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">E-mail</label>
                            <input type="email"
                                class="w-full rounded-lg border border-gray-300 dark:border-gray-700 p-2.5 text-sm dark:bg-gray-800 dark:text-white bg-gray-50"
                                value="usuario@exemplo.com" readonly>
                        </div>
                    </div>
                </div>

                <!-- App Preferences -->
                <div
                    class="bg-white dark:bg-background-dark p-6 rounded-xl shadow-sm border border-gray-200 dark:border-gray-800">
                    <h2 class="text-lg font-semibold mb-4">Preferências do Sistema</h2>
                    <div class="space-y-4">
                        <div class="flex items-center justify-between">
                            <div>
                                <p class="font-medium">Modo Escuro</p>
                                <p class="text-sm text-gray-500">Ativar tema escuro na interface</p>
                            </div>
                            <label class="relative inline-flex items-center cursor-pointer">
                                <input type="checkbox" class="sr-only peer">
                                <div
                                    class="w-11 h-6 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary">
                                </div>
                            </label>
                        </div>
                        <div class="flex items-center justify-between">
                            <div>
                                <p class="font-medium">Notificações por E-mail</p>
                                <p class="text-sm text-gray-500">Receber atualizações diárias</p>
                            </div>
                            <label class="relative inline-flex items-center cursor-pointer">
                                <input type="checkbox" class="sr-only peer" checked>
                                <div
                                    class="w-11 h-6 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary">
                                </div>
                            </label>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>

</html>
