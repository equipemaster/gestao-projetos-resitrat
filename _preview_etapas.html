<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8" />
  <title>Preview Etapas Order</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0" rel="stylesheet" />
  <script>
    tailwind.config = { theme: { extend: { colors: { primary: "#135bec" } } } };
    function escapeHtml(v) { return String(v == null ? '' : v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  </script>
</head>
<body class="p-8">
  <div id="out" class="max-w-sm"></div>
  <script src="js/gestao_avista.js"></script>
  <script>
    // Force a scenario that used to break ordering: the DONE task is the
    // longest-running one, so the old "pin longest to front" logic would put
    // it before the In Progress task. It must NOT anymore.
    const now = Date.now();
    tasksByProject = {
      p1: [
        { id: 'a', status: 'Done', title: 'Tarefa concluida antiga (mais longa)', created_at: new Date(now - 30*24*3600*1000).toISOString(), due_date: new Date(now - 20*24*3600*1000).toISOString().slice(0,10) },
        { id: 'b', status: 'In Progress', title: 'Tarefa em andamento', created_at: new Date(now - 2*24*3600*1000).toISOString(), due_date: null },
        { id: 'c', status: 'To Do', title: 'Tarefa a fazer', created_at: new Date(now - 1*24*3600*1000).toISOString(), due_date: null },
        { id: 'd', status: 'Done', title: 'Outra concluida', created_at: new Date(now - 5*24*3600*1000).toISOString(), due_date: new Date(now - 4*24*3600*1000).toISOString().slice(0,10) }
      ]
    };
    document.getElementById('out').innerHTML = renderEtapas('p1');
  </script>
</body>
</html>
